on:
  workflow_dispatch:

name: Build

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    name: Check [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: ${{ matrix.java-distribution || 'temurin' }}
        java-version: 17
    - if: ${{ matrix.arch == 'arm64' && (matrix.os == 'ubuntu-latest' || 
        matrix.os == 'windows-latest') }}
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-36'
    - if: ${{ matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64' }}
      name: Enable x86_64 emulation for Android build tools (aapt2)
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binfmt-support libc6-amd64-cross libstdc++6-amd64-cross
        sudo mkdir -p /lib64
        sudo ln -sf /usr/x86_64-linux-gnu/lib64/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2
        sudo update-binfmts --enable qemu-x86_64 || true
        echo "QEMU_LD_PREFIX=/usr/x86_64-linux-gnu" >> "$GITHUB_ENV"
    - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      run: ./gradlew build --stacktrace
    - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      run: |
        export RELEASE_STORE_FILE=$(pwd)/gotfy-release-key.jks
        echo $RELEASE_KEY | base64 -d > $RELEASE_STORE_FILE
        ./gradlew -Psign build --stacktrace
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Gotify.apk
      env:
        RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        RELEASE_STORE_PASSWORD: ${{ secrets.STOREPASS }}
        RELEASE_KEY_ALIAS: gotify-release-key
        RELEASE_KEY_PASSWORD: ${{ secrets.KEYPASS }}
    - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: app/build/outputs/apk/release/Gotify.apk
        tag: ${{ github.ref }}
        overwrite: true
    timeout-minutes: 150
